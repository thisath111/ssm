name: Code Quality & Bug Hunter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday security scan

jobs:
  analyze:
    name: Advanced Bug Scan
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --all-targets

      - name: Run Automated Unit Tests
        run: cargo test --all-targets -- --nocapture

      - name: Run Clippy (Bug Hunter)
        run: cargo clippy --all-targets -- -W clippy::all -W clippy::pedantic -W clippy::nursery
        continue-on-error: true

      - name: Run Security Vulnerability Audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
