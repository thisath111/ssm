name: Code Quality & Bug Hunter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday

jobs:
  analyze:
    name: Advanced Bug Scan
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --all-targets --all-features

      - name: Run Clippy (Bug Hunter)
        # This scans the entire codebase for bad practices, hidden bugs, memory leaks, and logic errors.
        run: cargo clippy --all-targets --all-features -- -W clippy::all -W clippy::pedantic -W clippy::nursery
        continue-on-error: true

      - name: Install Cargo Audit
        run: cargo install cargo-audit

      - name: Run Security Vulnerability Audit
        run: cargo audit
